<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Padhai Mantra</title>
  <meta name="description" content="Reset your Padhai Mantra student account password using your registered mobile number.">
  <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">

  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="preview-frame-mode mode-desktop-1440">

  <!-- Viewport Switcher Toolbar -->
  <div class="pm-preview-toolbar" role="region" aria-label="Design System Viewport Switcher">
    <div class="pm-toolbar-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: #60A5FA;"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
      <span>Padhai Mantra UI Redesign — Forgot Password</span>
    </div>
    <div class="pm-toolbar-controls">
      <button type="button" class="pm-mode-btn active" data-mode="desktop-1440">Desktop 1440px</button>
      <button type="button" class="pm-mode-btn" data-mode="mobile-390">Mobile 390px</button>
      <button type="button" class="pm-mode-btn" data-mode="mobile-360">Android 360px</button>
      <button type="button" class="pm-mode-btn" data-mode="responsive-fluid">Fluid Responsive</button>
    </div>
  </div>

  <div class="preview-stage">
    <div class="preview-frame">

      <!-- Header -->
      <header class="pm-header">
        <div class="pm-container">
          <div class="pm-header-inner">
            <a href="index.html" class="pm-brand">
              <img src="assets/logo.png" alt="Padhai Mantra" style="height: 44px; width: auto;">
            </a>
            <div style="font-size: 0.875rem; color: var(--pm-slate-600);">
              Remember your password? <a href="login.html" style="font-weight: 700;">Log in</a>
            </div>
          </div>
        </div>
      </header>

      <!-- Forgot Password Form (Matched to redesigned Login card per brief p. 49) -->
      <main class="pm-auth-wrapper">
        <div class="pm-auth-card">
          
          <div style="text-align: center; margin-bottom: var(--sp-6);">
            <div style="width: 52px; height: 52px; border-radius: 50%; background: var(--pm-primary-50); color: var(--pm-primary); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; margin: 0 auto var(--sp-3) auto; border: 1px solid var(--pm-primary-200);">
              🔑
            </div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--pm-slate-900); margin-bottom: 6px;">Forgot Password?</h1>
            <!-- Real text from brief screenshot page 49 -->
            <p style="font-size: 0.84375rem; color: var(--pm-slate-600); line-height: 1.55;">
              No worries. Enter your registered mobile number and we'll send you instructions to reset your password.
            </p>
          </div>

          <form onsubmit="event.preventDefault(); alert('Password recovery instructions sent to your mobile number!');">
            <div class="pm-form-group">
              <label class="pm-form-label">Mobile Number *</label>
              <input type="tel" class="pm-form-input" placeholder="Enter your phone number" required>
            </div>

            <button type="submit" class="pm-btn pm-btn-primary" style="width: 100%; padding: 13px; font-size: 0.9375rem; margin-bottom: 16px;">
              <span>Send Instructions</span>
              <span>✈</span>
            </button>

            <div style="text-align: center; margin-bottom: 16px;">
              <a href="login.html" class="pm-btn-text" style="font-size: 0.875rem;">
                ← Back to Login
              </a>
            </div>

            <div style="font-size: 0.75rem; color: var(--pm-slate-400); text-align: center; margin-top: 20px; border-top: 1px solid var(--pm-slate-100); padding-top: 14px;">
              <a href="terms.html" style="color: var(--pm-slate-500);">Terms of Service</a> • <a href="privacy.html" style="color: var(--pm-slate-500);">Privacy Policy</a>
            </div>
          </form>

        </div>
      </main>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
